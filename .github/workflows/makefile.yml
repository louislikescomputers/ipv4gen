name: Build

# Builds the `ipgen` CLI and `ipgen-mcp` server for as many platforms as
# GitHub Actions runners allow, runs the test suite on each native platform,
# and uploads per-platform release archives. On tags (v*) it also publishes a
# GitHub Release with every binary attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # Native builds + tests: Windows, Linux, macOS (Intel + Apple Silicon)
  # --------------------------------------------------------------------------
  build-native:
    name: ${{ matrix.os_name }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Ubuntu x86_64 (GNU)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - os_name: Ubuntu x86_64 (musl, fully static)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: false
          - os_name: Ubuntu aarch64 (musl, cross-compiled)
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
          - os_name: Windows x86_64 (MSVC)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - os_name: macOS Intel
            runner: macos-13
            target: x86_64-apple-darwin
            cross: false
          - os_name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo (registry, index, build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/cargo/registry
            ~/AppData/Local/cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ---- Linux prerequisites -------------------------------------------
      - name: Install musl cross toolchain (Linux musl targets)
        if: runner.os == 'Linux' && endsWith(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          fi

      # ---- Tests (native targets only; cross targets can't execute here) --
      - name: Run unit + integration tests
        if: matrix.cross == false
        run: cargo test --release --target ${{ matrix.target }} --workspace

      - name: Clippy (non-blocking advisory)
        if: matrix.cross == false && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        run: cargo clippy --release --target ${{ matrix.target }} --workspace -- -D warnings

      # ---- Build -----------------------------------------------------------
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin ipgen --bin ipgen-mcp

      # ---- Smoke test the freshly built binaries ----------------------------
      - name: Smoke test binaries
        if: matrix.cross == false
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          "$BIN/ipgen" --version
          "$BIN/ipgen" generate --count 5
          "$BIN/ipgen" generate --count 3 --format cidr
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | "$BIN/ipgen-mcp" | head -1
          # Validate every emitted line looks like an IPv4 address
          "$BIN/ipgen" generate --count 100 | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'

      # ---- Package artifacts -----------------------------------------------
      - name: Package artifacts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ipgen" \
             "target/${{ matrix.target }}/release/ipgen-mcp" dist/
          ( cd dist && tar czf "../ipgen-${{ matrix.target }}.tar.gz" ipgen ipgen-mcp )

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ipgen.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/ipgen-mcp.exe" dist/
          Compress-Archive -Path dist/ipgen.exe, dist/ipgen-mcp.exe `
            -DestinationPath "ipgen-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipgen-${{ matrix.target }}
          path: |
            ipgen-${{ matrix.target }}.tar.gz
            ipgen-${{ matrix.target }}.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows ARM64, cross-compiled on Linux using xwin for the MSVC libs
  # --------------------------------------------------------------------------
  build-windows-arm64:
    name: Windows ARM64 (aarch64-pc-windows-msvc)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-msvc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM/lld (linker for windows-msvc cross)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld llvm
          echo 'CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=lld-link' >> "$GITHUB_ENV"

      - name: Fetch Windows SDK import libraries (xwin)
        run: |
          cargo install xwin --locked
          ~/.cargo/bin/xwin --accept-license splat --output ~/.xwin

      - name: Set CRT / SDK env
        run: |
          echo 'CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS=-Ctarget-feature=+crt-static -L ~/.xwin/crt/lib/aarch64 -L ~/.xwin/sdk/lib/um/aarch64 -L ~/.xwin/sdk/lib/ucrt/aarch64' >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin ipgen --bin ipgen-mcp

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ipgen.exe" \
             "target/${{ matrix.target }}/release/ipgen-mcp.exe" dist/
          tar czf "ipgen-${{ matrix.target }}.tar.gz" -C dist ipgen.exe ipgen-mcp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipgen-${{ matrix.target }}
          path: ipgen-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # GitHub Release (only when a v* tag is pushed)
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-native, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show collected bundles
        run: ls -laR artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
