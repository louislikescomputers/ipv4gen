[package]
name = "ipgen-mcp"
description = "MCP (Model Context Protocol) stdio server for the ipgen IPv4 generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ipgen-mcp"
path = "src/main.rs"

[dependencies]
ipgen-core = { path = "../ipgen-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
