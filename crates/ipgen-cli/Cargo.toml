[package]
name = "ipgen-cli"
description = "CLI for the ipgen IPv4 range generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ipgen"
path = "src/main.rs"

[dependencies]
ipgen-core = { path = "../ipgen-core" }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde_json = "1.0"
